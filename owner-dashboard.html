<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Lantern Library — Owner Dashboard Demo</title><link rel="icon" type="image/jpeg" href="lantern-library-logo.jpg">
<style>
:root{--ink:#2b211c;--muted:#75675b;--paper:#f5efe3;--paper2:#e9decb;--wine:#702f36;--gold:#b18a4c;--line:#d9cbb7;--white:#fffaf2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}.top{padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.brand{font-size:20px;display:flex;align-items:center}.logo-lockup{display:block;width:230px;max-width:55vw;height:auto;mix-blend-mode:multiply}.sub{font:10px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:5px}.btn{padding:11px 15px;border:1px solid var(--wine);background:var(--wine);color:#fffaf2;font:11px Arial,sans-serif;cursor:pointer}.btn.alt{background:transparent;color:var(--wine)}.layout{display:grid;grid-template-columns:190px 1fr;max-width:1300px;margin:auto;min-height:calc(100vh - 75px)}aside{padding:22px 12px;border-right:1px solid var(--line)}aside button{display:block;width:100%;padding:13px;text-align:left;background:transparent;border:0;color:var(--muted);cursor:pointer;font:12px Arial,sans-serif}aside button.active,aside button:hover{background:var(--paper2);color:var(--wine)}main{padding:30px 4%}h1{font-size:38px;font-weight:400;margin:0 0 8px}.hint{font:13px Arial,sans-serif;color:var(--muted);margin-bottom:24px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat,.panel{background:var(--white);border:1px solid var(--line);padding:18px}.stat span{font:10px Arial,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.stat strong{display:block;font-size:28px;font-weight:400;margin-top:10px}.panel{margin-bottom:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.panel h2{font-weight:400;margin:0;font-size:22px}.note{padding:12px;background:var(--paper2);border-left:3px solid var(--gold);font:12px Arial,sans-serif;line-height:1.5;margin-bottom:18px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font:12px Arial,sans-serif}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{font-size:10px;text-transform:uppercase;color:var(--muted)}input,select,textarea{padding:10px;border:1px solid var(--line);background:var(--white);font:13px Arial,sans-serif;max-width:100%}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font:10px Arial,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{padding:20px;color:var(--muted);font:13px Arial,sans-serif}.small{padding:6px 8px;border:1px solid var(--line);background:transparent;cursor:pointer;font:10px Arial,sans-serif}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 16px;font:12px Arial,sans-serif;display:none}
@media(max-width:650px){.logo-lockup{width:190px}.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}aside button{white-space:nowrap;width:auto}main{padding:22px 4%}.stats{grid-template-columns:1fr}.top{padding:15px 4%}.grid{grid-template-columns:1fr}h1{font-size:31px}}
</style></head>
<body>
<header class="top"><div><img class="logo-lockup" src="lantern-library-logo.jpg" alt="The Lantern Library logo"><div class="sub">Owner workspace · demo only</div></div><button class="btn alt" onclick="alert('Storefront demo is in index.html. Open that file in Chrome to view it.')">Storefront info</button></header>
<div class="layout"><aside><button class="active" onclick="tab('overview',this)">◫ Overview</button><button onclick="tab('products',this)">▤ Products</button><button onclick="tab('orders',this)">▣ Orders</button><button onclick="tab('settings',this)">⚙ Store settings</button></aside><main id="main"></main></div><div class="toast" id="toast"></div>
<script>
const initial=[{id:1,name:'Kashmir Postcard Tote',price:499,category:'Kashmir Collection',stock:12,emoji:'👜'},{id:2,name:'Literary Collage Phone Case',price:599,category:'Literary Treasures',stock:8,emoji:'📱'},{id:3,name:'A Letter from Kashmir',price:249,category:'Everyday Keepsakes',stock:20,emoji:'✉️'},{id:4,name:'Antique Miniature Frame',price:399,category:'Art & Objects',stock:6,emoji:'🖼️'}];
let products=load('tll_products',initial),orders=load('tll_orders',[]);
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem('tll_products',JSON.stringify(products));localStorage.setItem('tll_orders',JSON.stringify(orders))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function tab(name,btn){document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');let m=document.getElementById('main');
if(name==='overview'){m.innerHTML=`<h1>Good day, owner.</h1><div class="hint">Your little shop, at a glance. This is a local demo dashboard.</div><div class="stats"><div class="stat"><span>Products listed</span><strong>${products.length}</strong></div><div class="stat"><span>Demo orders</span><strong>${orders.length}</strong></div><div class="stat"><span>Demo order value</span><strong>${money(orders.reduce((a,o)=>a+o.total,0))}</strong></div></div><div class="panel"><div class="panelhead"><h2>Recent orders</h2><button class="small" onclick="tab('orders')">View all</button></div>${orders.length?orders.map(o=>`<p>${esc(o.id)} · ${esc(o.name)} · ${money(o.total)} · ${esc(o.status)}</p>`).join(''):'<div class="empty">No demo orders yet. Orders placed through the storefront will only appear here if both pages use the same browser storage.</div>'}</div><div class="note">Prototype only: no secure owner login, shared database, real payments or notifications. Do not enter real customer information.</div>`}
if(name==='products'){m.innerHTML=`<h1>Products</h1><div class="hint">Add or update sample products. Changes save in this browser only.</div><div class="panel"><div class="panelhead"><h2>Collection (${products.length})</h2><button class="btn" onclick="productForm()">＋ Add product</button></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Collection</th><th>Actions</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.emoji)} ${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${esc(p.category)}</td><td><button class="small" onclick="productForm(${p.id})">Edit</button> <button class="small" onclick="del(${p.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div><div id="formbox"></div>`}
if(name==='orders'){m.innerHTML=`<h1>Orders</h1><div class="hint">Review orders and change their demo status.</div><div class="panel">${orders.length?`<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>${orders.map((o,i)=>`<tr><td>${esc(o.id)}</td><td>${esc(o.name)}<br>${esc(o.phone||'')}</td><td>${money(o.total)}</td><td><select onchange="orders[${i}].status=this.value;save();toast('Status updated')">${['New order','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No demo orders yet.</div>'}</div>`}
if(name==='settings'){m.innerHTML=`<h1>Store settings</h1><div class="hint">Preview editable settings for the storefront.</div><div class="panel"><div class="field"><label>Store name</label><input id="sn" value="The Lantern Library"></div><div class="field"><label>Tagline</label><input id="st" value="From Kashmir, to Kashmir"></div><div class="field"><label>Announcement</label><input id="sa" value="A little piece of Kashmir, wherever you are · Made with meaning"></div><button class="btn" onclick="toast('Settings preview saved for this dashboard demo')">Save settings</button></div>`}}
function productForm(id){let p=products.find(x=>x.id===id)||{name:'',price:'',stock:10,category:'Kashmir Collection',emoji:'✧'};document.getElementById('formbox').innerHTML=`<div class="panel"><h2>${id?'Edit':'Add'} product</h2><form onsubmit="saveProduct(event,${id||'null'})"><div class="grid"><div class="field"><label>Name</label><input id="pn" required value="${esc(p.name)}"></div><div class="field"><label>Price (₹)</label><input id="pp" type="number" min="0" required value="${p.price}"></div><div class="field"><label>Collection</label><select id="pc">${['Kashmir Collection','Literary Treasures','Everyday Keepsakes','Art & Objects'].map(s=>`<option ${p.category===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Stock</label><input id="ps" type="number" min="0" required value="${p.stock}"></div><div class="field"><label>Icon / emoji</label><input id="pe" value="${esc(p.emoji)}"></div></div><button class="btn">Save product</button></form></div>`}
function saveProduct(e,id){e.preventDefault();let p={id:id||Date.now(),name:document.getElementById('pn').value,price:Number(document.getElementById('pp').value),category:document.getElementById('pc').value,stock:Number(document.getElementById('ps').value),emoji:document.getElementById('pe').value||'✧'};products=id?products.map(x=>x.id===id?p:x):[p,...products];save();tab('products',document.querySelectorAll('aside button')[1]);toast('Product saved')}
function del(id){if(confirm('Delete this demo product?')){products=products.filter(p=>p.id!==id);save();tab('products',document.querySelectorAll('aside button')[1]);toast('Product deleted')}}
tab('overview',document.querySelector('aside button'));
</script></body></html>
